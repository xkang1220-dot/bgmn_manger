server:
  port: 8080

spring:
  application:
    name: kk-manager
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/kk_manager?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kk.common.entity,com.kk.system.entity,com.kk.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true

kk:
  file:
    storage:
      provider: rustfs
      prefix: kk-files
      ledger-voucher-prefix: ledger-vouchers
      max-size-mb: 100
      local:
        base-path: ./uploads
      rustfs:
        endpoint: ${RUSTFS_ENDPOINT:http://127.0.0.1:9000}
        access-key: ${RUSTFS_ACCESS_KEY:minioadmin}
        secret-key: ${RUSTFS_SECRET_KEY:minioadmin}
        bucket: kk-manager
        domain: ${RUSTFS_DOMAIN:http://127.0.0.1:9000}
  totp:
    issuer: KK Manager
    secret-master-key: ${TOTP_MASTER_KEY:change-me-in-production}

logging:
  level:
    com.kk: debug
