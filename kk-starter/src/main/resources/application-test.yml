server:
  port: 8999

spring:
  application:
    name: kk-manager
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      host: ${REDIS_HOST:192.168.110.110}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:LrhiaBMY8oRdzKP4TDdN}
      timeout: 3s
      repositories:
        enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.110.110:3306/kk_manager_bgmn_doc_v1?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    #    url: jdbc:mysql://127.0.0.1:3306/kk_manager_bgmn_doc_v1?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    username: root
    password: uF6H0hQHq6e9dDpWvdj1
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.kk.common.entity,com.kk.system.entity,com.kk.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true

kk:
  web:
    # 对外任务跳转链接前缀（管理端前端地址，不要末尾斜杠）
    base-url: ${KK_WEB_BASE_URL:http://localhost:5173}
  file:
    storage:
      provider: rustfs
      prefix: kk-files
      ledger-voucher-prefix: ledger-vouchers
      max-size-mb: 500
      local:
        base-path: ${KK_FILE_LOCAL_PATH:./uploads}
      rustfs:
        endpoint: ${RUSTFS_ENDPOINT:http://59.110.33.84:9000}
        access-key: rustfsadmin
        secret-key: hjinrisYwDcPApsmb0WN
        bucket: ${RUSTFS_BUCKET:kk-manager}
        domain: ${RUSTFS_DOMAIN:http://59.110.33.84:9000}
  totp:
    issuer: KK Manager
    secret-master-key: ${TOTP_MASTER_KEY:KkTotp~SecretKey2026!ChangeMe}

logging:
  level:
    com.kk: debug

# AI 任务助手。测试环境也会被本地 IDEA 启动配置使用，因此不能只在 dev 中配置。
ai:
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}
  api-key: ${AI_API_KEY:sk-6afd4454786446858c4071dbccc537ee}
  max-tool-calls: 6
  tool-trace-enabled: true
